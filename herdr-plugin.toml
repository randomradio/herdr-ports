id = "herdr.ports_forwarding"
name = "Remote Ports"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Open a remote Herdr workspace port on this laptop as http://herdr.{workspace}.localhost:{port}."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[build]]
command = ["cp", "target/release/herdr-ports", "herdr-ports"]

[[startup]]
command = ["./herdr-ports", "restore"]

[[actions]]
id = "pick"
title = "Pick remote port"
contexts = ["global", "workspace"]
command = ["./herdr-ports", "open-picker"]

[[actions]]
id = "list"
title = "List port forwards"
contexts = ["global"]
command = ["./herdr-ports", "list"]

[[actions]]
id = "forward-url"
title = "Forward localhost URL"
contexts = ["global"]
command = ["./herdr-ports", "from-url"]

[[panes]]
id = "picker"
title = "Remote ports"
placement = "popup"
width = "80%"
height = "70%"
command = ["./herdr-ports", "pick"]

[[link_handlers]]
id = "localhost"
title = "Forward localhost URL"
pattern = "^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\]|herdr\\.[A-Za-z0-9.-]+\\.localhost)(:[0-9]+)?([/?#].*)?$"
action = "forward-url"
